name: Build & Auto-Release Android APKs (ARM64 + Universal)

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Custom release tag (e.g. v1.0.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed APKs (arm64-v8a, armeabi-v7a, x86_64, universal)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Prepare Keystores for Release & Debug Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Ensure debug.keystore exists
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Use repository secret keystore if configured, otherwise generate an Ephemeral Release Keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "STORE_PASSWORD=${SECRET_STORE_PASSWORD}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${SECRET_KEY_PASSWORD}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass truescreentime123 \
              -alias upload \
              -keypass truescreentime123 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=TrueScreenTime,O=OpenSource,C=US"
            echo "STORE_PASSWORD=truescreentime123" >> $GITHUB_ENV
            echo "KEY_PASSWORD=truescreentime123" >> $GITHUB_ENV
          fi
          echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV

      - name: Build ABI Split & Universal Release APKs
        run: |
          gradle :app:assembleRelease -PenableAbiSplits=true --stacktrace

      - name: Collect & Rename APKs (arm64, arm32, x86_64, universal)
        run: |
          mkdir -p release-apks
          OUT_DIR="app/build/outputs/apk/release"
          ls -la "$OUT_DIR"

          for apk in "$OUT_DIR"/*.apk; do
            filename=$(basename "$apk")
            case "$filename" in
              *arm64-v8a*)
                cp "$apk" "release-apks/TrueScreenTime-arm64-v8a.apk"
                ;;
              *armeabi-v7a*)
                cp "$apk" "release-apks/TrueScreenTime-armeabi-v7a.apk"
                ;;
              *x86_64*)
                cp "$apk" "release-apks/TrueScreenTime-x86_64.apk"
                ;;
              *x86-*)
                cp "$apk" "release-apks/TrueScreenTime-x86.apk"
                ;;
              *universal*)
                cp "$apk" "release-apks/TrueScreenTime-universal.apk"
                ;;
              *)
                cp "$apk" "release-apks/TrueScreenTime-universal.apk"
                ;;
            esac
          done

          cd release-apks
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload APKs as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrueScreenTime-APKs
          path: release-apks/*

      - name: Determine Release Tag
        id: tag
        run: |
          if [[ "${{ github.event.inputs.release_tag }}" != "" ]]; then
            echo "tag_name=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag_name=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release with Multi-Arch APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "True Screen Time ${{ steps.tag.outputs.tag_name }}"
          generate_release_notes: true
          body: |
            ## True Screen Time — Android Release APKs
            Chronological morning-to-night app session timeline with exact start & end timestamps, idle lock gap tracking, pickup counter, and 24-hour activity ribbon.

            ### 📦 Which APK should I download?
            - **`TrueScreenTime-arm64-v8a.apk`** *(Recommended)* — For almost all modern Android phones & tablets (64-bit ARM).
            - **`TrueScreenTime-universal.apk`** — Works on every Android device and architecture.
            - **`TrueScreenTime-armeabi-v7a.apk`** — For older 32-bit ARM Android devices.
            - **`TrueScreenTime-x86_64.apk`** — For Android emulators, PCs, and Chromebooks.
          files: |
            release-apks/*.apk
            release-apks/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
