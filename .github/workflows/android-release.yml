name: Build & Auto-Release Android APKs (ARM64 + Universal)

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Custom release tag (e.g. v1.0.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed APKs (arm64-v8a, armeabi-v7a, x86_64, universal)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK & Accept Licenses (API 36.1)
        run: |
          set -e
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          sudo mkdir -p "$SDK_DIR/licenses"
          sudo chown -R "$(whoami)" "$SDK_DIR" || true

          # Write official Google Android SDK license hashes directly
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$SDK_DIR/licenses/android-sdk-preview-license"

          # Locate sdkmanager or install Android commandlinetools if not present
          SDKMANAGER=$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$SDKMANAGER" ]; then
            echo "Installing Android command-line tools..."
            mkdir -p "$SDK_DIR/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d "$SDK_DIR/cmdline-tools"
            mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          fi

          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0"

          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle 9.3.1
        run: |
          set -e
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle-9.3.1-bin.zip
          sudo mkdir -p /opt/gradle-dist
          sudo unzip -q -o /tmp/gradle-9.3.1-bin.zip -d /opt/gradle-dist
          echo "/opt/gradle-dist/gradle-9.3.1/bin" >> "$GITHUB_PATH"
          /opt/gradle-dist/gradle-9.3.1/bin/gradle --version

      - name: Prepare Environment & Signing Keystores
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          # Ensure .env exists for Secrets Gradle Plugin (.env is gitignored)
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # Ensure debug.keystore exists
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 --decode debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          # Prepare Release Keystore
          rm -f my-upload-key.jks
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "STORE_PASSWORD=${SECRET_STORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${SECRET_KEY_PASSWORD}" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass truescreentime123 \
              -alias upload \
              -keypass truescreentime123 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=TrueScreenTime,O=OpenSource,C=US"
            echo "STORE_PASSWORD=truescreentime123" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=truescreentime123" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> "$GITHUB_ENV"

      - name: Build ABI Split & Universal Release APKs
        run: |
          set -e
          gradle :app:assembleRelease -PenableAbiSplits=true --no-configuration-cache --stacktrace

      - name: Collect & Rename APKs (arm64, arm32, x86_64, universal)
        run: |
          set -e
          mkdir -p release-apks
          OUT_DIR="app/build/outputs/apk/release"
          ls -la "$OUT_DIR"

          for apk in "$OUT_DIR"/*.apk; do
            [ -e "$apk" ] || continue
            filename=$(basename "$apk")
            case "$filename" in
              *arm64-v8a*)
                cp "$apk" "release-apks/TrueScreenTime-arm64-v8a.apk"
                ;;
              *armeabi-v7a*)
                cp "$apk" "release-apks/TrueScreenTime-armeabi-v7a.apk"
                ;;
              *x86_64*)
                cp "$apk" "release-apks/TrueScreenTime-x86_64.apk"
                ;;
              *x86-*)
                cp "$apk" "release-apks/TrueScreenTime-x86.apk"
                ;;
              *universal*)
                cp "$apk" "release-apks/TrueScreenTime-universal.apk"
                ;;
              *)
                cp "$apk" "release-apks/TrueScreenTime-universal.apk"
                ;;
            esac
          done

          cd release-apks
          ls -la
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload APKs as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrueScreenTime-APKs
          path: release-apks/*

      - name: Publish GitHub Release with Multi-Arch APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v1.0.${{ github.run_number }}"
          fi

          cat << 'EOF' > release-notes.md
          ## True Screen Time — Android Release APKs
          Chronological morning-to-night app session timeline with exact start & end timestamps, idle lock gap tracking, pickup counter, and 24-hour activity ribbon.

          ### 📦 Which APK should I download?
          - **`TrueScreenTime-arm64-v8a.apk`** *(Recommended)* — For almost all modern Android phones & tablets (64-bit ARM).
          - **`TrueScreenTime-universal.apk`** — Works on every Android device and architecture.
          - **`TrueScreenTime-armeabi-v7a.apk`** — For older 32-bit ARM Android devices.
          - **`TrueScreenTime-x86_64.apk`** — For Android emulators, PCs, and Chromebooks.
          EOF

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-apks/*.apk release-apks/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG_NAME" release-apks/*.apk release-apks/SHA256SUMS.txt \
              --title "True Screen Time $TAG_NAME" \
              --notes-file release-notes.md \
              --target "${GITHUB_SHA}"
          fi
